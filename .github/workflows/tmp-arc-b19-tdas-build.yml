name: Build Arc b19 TDAS
on:
  push:
    branches: [tmp-arc-b19-tdas-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched LKM for epyc7002 DSM 7.4
        shell: bash
        run: |
          set -euxo pipefail
          ROOT_PATH="$GITHUB_WORKSPACE"
          VERSION=7.4
          PLATFORM=epyc7002
          git clone https://github.com/SynologyOpenSource/pkgscripts-ng.git "$ROOT_PATH/pkgscripts-ng"
          cd "$ROOT_PATH/pkgscripts-ng"
          git checkout DSM7.4
          sudo ./EnvDeploy -q -v 7.4 -p epyc7002
          mkdir -p "$ROOT_PATH/source"
          ENV_PATH="$ROOT_PATH/build_env/ds.epyc7002-7.4"
          sudo cp -al "$ROOT_PATH/pkgscripts-ng" "$ENV_PATH/pkgscripts-ng"
          sudo chroot "$ENV_PATH" <<'EOF'
          cd pkgscripts
          sed -i 's/print(" ".join(kernels))/pass #&/' ProjectDepends.py
          sed -i '/PLATFORM_FAMILY/a\	echo "PRODUCT=$PRODUCT" >> $file\n\techo "KSRC=$KERNEL_SEARCH_PATH" >> $file\n\techo "LINUX_SRC=$KERNEL_SEARCH_PATH" >> $file' include/build
          ./SynoBuild -c -p epyc7002
          while read -r line; do if [ "${line:0:1}" != "#" ]; then export ${line%%=*}="${line#*=}"; fi; done < /env${BUILD_ARCH}.mak
          if [ -f "${KSRC}/Makefile" ]; then
            KVERSION=$(grep '^VERSION ' "${KSRC}/Makefile" | awk '{print $3}')
            PATCHLEVEL=$(grep '^PATCHLEVEL ' "${KSRC}/Makefile" | awk '{print $3}')
            SUBLEVEL=$(grep '^SUBLEVEL ' "${KSRC}/Makefile" | awk '{print $3}')
            echo "KVER=${KVERSION}.${PATCHLEVEL}.${SUBLEVEL}" >> /env${BUILD_ARCH}.mak
          fi
          EOF
          echo '' | base64 -d > "$ROOT_PATH/tdas.patch"
          sudo chroot "$ENV_PATH" /bin/bash -lc '
            set -eux
            sed -i "s/^CFLAGS=/#CFLAGS=/g; s/^CXXFLAGS=/#CXXFLAGS=/g" /env${BUILD_ARCH}.mak
            while read -r line; do if [ "${line:0:1}" != "#" ]; then export ${line%%=*}="${line#*=}"; fi; done < /env${BUILD_ARCH}.mak
            mkdir -p /source/output
            git clone https://github.com/AuxXxilium/arc-lkm.git /source/input
            cd /source/input
            git checkout 4445f57494888fa12e4db4b7c02a790072bd7259 || true
          '
          sudo cp "$ROOT_PATH/tdas.patch" "$ENV_PATH/tmp/tdas.patch"
          sudo chroot "$ENV_PATH" /bin/bash -lc '
            set -eux
            sed -i "s/^CFLAGS=/#CFLAGS=/g; s/^CXXFLAGS=/#CXXFLAGS=/g" /env${BUILD_ARCH}.mak
            while read -r line; do if [ "${line:0:1}" != "#" ]; then export ${line%%=*}="${line#*=}"; fi; done < /env${BUILD_ARCH}.mak
            cd /source/input
            git reset --hard
            git checkout 4445f57494888fa12e4db4b7c02a790072bd7259
            git apply /tmp/tdas.patch
            [ -z "$(grep env.mak Makefile || true)" ] && sed -i "1 i include /env.mak" Makefile
            PLATFORM=epyc7002 make -j$(nproc) CC="${CC}" prod-v7
            strip -g redpill.ko
            modinfo redpill.ko
            RPKOVER=$(modinfo --field=vermagic redpill.ko | awk "{print \$1}")
            gzip -9 redpill.ko
            mv redpill.ko.gz "/source/output/rp-epyc7002-7.4-${RPKOVER/+/-}prod.ko.gz"
          '
          sudo cp -a "$ENV_PATH/source/output/." "$ROOT_PATH/"
          ls -lh "$ROOT_PATH"/*.ko.gz

      - name: Normalize LKM filename
        run: |
          set -eux
          f=$(ls rp-epyc7002-7.4-*.ko.gz | head -1)
          mv "$f" rp-epyc7002-7.4-5.10.55-prod.ko.gz
          gzip -dc rp-epyc7002-7.4-5.10.55-prod.ko.gz > redpill-epyc7002-7.4-5.10.55-tdas-prod.ko
          modinfo redpill-epyc7002-7.4-5.10.55-tdas-prod.ko
          sha256sum rp-epyc7002-7.4-5.10.55-prod.ko.gz redpill-epyc7002-7.4-5.10.55-tdas-prod.ko > SHA256SUMS.txt

      - name: Download Arc b19 image
        run: |
          set -eux
          wget -O arc-b19.zip https://github.com/AuxXxilium/arc-beta/releases/download/4.0.0b19/arc-4.0.0b19.img.zip
          echo 'f4dc47e5cecf073f77727e4d3c0a05b92a09977037baede74ac5ffc8c856e1f0  arc-b19.zip' | sha256sum -c -
          unzip arc-b19.zip
          IMG=$(find . -maxdepth 1 -type f -name '*.img' | head -1)
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Inject patched LKM into Arc image
        run: |
          set -euxo pipefail
          LOOP=$(sudo losetup --show -Pf "$IMG")
          echo "LOOP=$LOOP"
          lsblk "$LOOP"
          mkdir -p mntp3
          sudo mount "${LOOP}p3" mntp3
          sudo find mntp3 -maxdepth 3 -type f -name 'rp-epyc7002-7.4-5.10.55-prod.ko.gz' -print
          TARGET=$(sudo find mntp3 -type f -path '*/lkms/rp-epyc7002-7.4-5.10.55-prod.ko.gz' | head -1)
          test -n "$TARGET"
          sudo cp rp-epyc7002-7.4-5.10.55-prod.ko.gz "$TARGET"
          sync
          sudo umount mntp3
          sudo losetup -d "$LOOP"
          mv "$IMG" arc-4.0.0b19-epyc7002-DSM74-TDAS.img
          sha256sum arc-4.0.0b19-epyc7002-DSM74-TDAS.img >> SHA256SUMS.txt
          zip -1 arc-4.0.0b19-epyc7002-DSM74-TDAS.img.zip arc-4.0.0b19-epyc7002-DSM74-TDAS.img SHA256SUMS.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: arc-b19-epyc7002-dsm74-tdas
          compression-level: 0
          path: |
            arc-4.0.0b19-epyc7002-DSM74-TDAS.img.zip
            rp-epyc7002-7.4-5.10.55-prod.ko.gz
            redpill-epyc7002-7.4-5.10.55-tdas-prod.ko
            SHA256SUMS.txt
