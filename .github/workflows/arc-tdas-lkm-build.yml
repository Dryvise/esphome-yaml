name: Temporary Arc TDAS LKM Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/arc_tdas_patch.py'
      - '.github/workflows/arc-tdas-lkm-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'tmp/arc-tdas-lkm-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Fetch pinned Arc LKM source
        run: |
          set -euxo pipefail
          git clone https://github.com/AuxXxilium/arc-lkm.git arc-lkm
          cd arc-lkm
          git checkout 4445f57494888fa12e4db4b7c02a790072bd7259
          git rev-parse HEAD

      - name: Apply TDAS USB-internal source transformation
        run: |
          set -euxo pipefail
          python3 .github/arc_tdas_patch.py
          cd arc-lkm
          git diff --check
          git diff -- shim/storage/sata_port_shim.c | tee ../arc-tdas-usb-internal.patch
          grep -n -F 'USB_INTERNAL_PATH "2-3.1.4"' shim/storage/sata_port_shim.c
          grep -n -F 'USB internal:' shim/storage/sata_port_shim.c

      - name: Build epyc7002 DSM 7.3 LKM
        run: |
          set -euxo pipefail
          cd arc-lkm
          chmod +x build-lkm.sh
          ./build-lkm.sh -v 7.3 -p epyc7002 2>&1 | tee ../build.log

      - name: Validate and package
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp arc-tdas-usb-internal.patch build.log dist/
          cp arc-lkm/releases/rp-epyc7002-7.3-5.10.55-*.ko.gz dist/

          PROD_GZ=$(find arc-lkm/releases -maxdepth 1 -type f -name 'rp-epyc7002-7.3-5.10.55-prod.ko.gz' -print -quit)
          test -n "$PROD_GZ"
          gzip -dc "$PROD_GZ" > dist/redpill-epyc7002-7.3-5.10.55-tdas-prod.ko

          file dist/redpill-epyc7002-7.3-5.10.55-tdas-prod.ko | tee dist/file.txt
          modinfo dist/redpill-epyc7002-7.3-5.10.55-tdas-prod.ko | tee dist/modinfo.txt
          strings dist/redpill-epyc7002-7.3-5.10.55-tdas-prod.ko | grep -F 'USB internal:' | tee dist/patch-strings.txt
          test -s dist/patch-strings.txt

          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload compiled LKM
        uses: actions/upload-artifact@v4
        with:
          name: arc-tdas-usb-internal-epyc7002-dsm73
          path: dist/*
          if-no-files-found: error
          retention-days: 7
