name: ChatGPT Arc target check

on:
  push:
    branches:
      - chatgpt/arc400-build

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arc 4.0.0 source
        uses: actions/checkout@v4
        with:
          repository: AuxXxilium/arc
          ref: f46e1f95fa147486516f97a804ad633829a45a98

      - name: Install Python requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user -r scripts/requirements.txt

      - name: Check exact DSM target for both models
        shell: bash
        run: |
          set -euo pipefail
          echo '===== SA6400 / 7.4.1-90080 ====='
          python3 scripts/functions.py getpats4mv -m 'SA6400' -v '7.4.1-90080'
          echo
          echo '===== DS425+ / 7.4.1-90080 ====='
          python3 scripts/functions.py getpats4mv -m 'DS425+' -v '7.4.1-90080'
